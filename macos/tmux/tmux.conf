# PATH del servidor tmux. run-shell y las interpolaciones #() NO heredan el PATH
# del shell interactivo: usan este. Sin /opt/homebrew/bin, TPM y los scripts de
# los plugins fallan con "tmux: command not found" y el autoguardado de
# continuum muere en silencio.
set-environment -g PATH "/opt/homebrew/bin:/opt/homebrew/sbin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin"

# window title
set-option -g set-titles on
set-option -g set-titles-string "#S — #W"

# prefix
unbind C-b
unbind C-a
set -g prefix C-x
set -g focus-events on

# mouse
set -g mouse on

# splits intuitivos
unbind |
bind | split-window -h
bind '\' split-window -h
unbind -
bind - split-window -v

# true color
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

# unbind last-pane
unbind \;
# unbind select-window by index
unbind "'"
# rename window
unbind r
bind r command-prompt -I "#W" "rename-window '%%'"

# copiar al clipboard de macOS
bind-key -T copy-mode-vi 'v' send -X begin-selection
bind-key -T copy-mode-vi 'y' send -X copy-pipe-and-cancel "pbcopy"

# vi keys to resize
bind -r C-k resize-pane -U 1
bind -r C-j resize-pane -D 1
bind -r C-h resize-pane -L 1
bind -r C-l resize-pane -R 1

# vi keys to navigate panes
bind -r k select-pane -U
bind -r j select-pane -D
bind -r h select-pane -L
bind -r l select-pane -R

# status bar
set -g status-position bottom
set -g status-bg colour236
set -g status-fg colour137
set -g status-interval 15
set -g status-left '#[fg=colour233,bg=colour241,bold] #S '
set -g status-left-length 50
set -g status-right '#[fg=colour250]#(cd #{pane_current_path} && git rev-parse --abbrev-ref HEAD 2>/dev/null) #[fg=colour233,bg=colour241,bold] #(~/.config/tmux/tmux_info.sh public_ip) #[fg=colour233,bg=colour241,bold] RAM:#(~/.config/tmux/tmux_info.sh ram) #[fg=colour233,bg=colour241,bold] CPU:#(~/.config/tmux/tmux_info.sh cpu)% #[fg=colour233,bg=colour245,bold] %d/%m #[fg=colour233,bg=colour245,bold] %H:%M:%S '
set -g status-right-length 120
setw -g mode-keys vi

# window tabs
setw -g window-status-current-format '#[fg=colour233,bg=colour245,bold] #I #[fg=colour255,bg=colour241,bold] #W#F '
setw -g window-status-format ' #I#[fg=colour237]:#[fg=colour250]#W#[fg=colour244]#F '

# pane borders
set -g pane-border-style "fg=#606060"
set -g pane-active-border-style "fg=#606060"

# copy mode selection
set -g mode-style "bg=#3a3a3a,fg=#c0c0c0"

# message style
set -g message-style "fg=colour255,bg=colour241"

# history
set-option -g history-limit 5000

# al matar una session, ir a la siguiente en vez de salir de tmux
set-option -g detach-on-destroy off

# renumerar ventanas automaticamente al cerrar una (sin huecos)
set-option -g renumber-windows on

# forzar redibujado completo (arregla desfase de TUIs como Claude Code)
bind R refresh-client -S

# reducir glitches de redibujado en TUIs
set -sg escape-time 10
set -g aggressive-resize on

# ---- popup terminal persistente (scratch por proyecto) ----
# C-x g  -> abre/recupera un popup full-screen ligado al proyecto actual.
#           Para esconderlo SIN perderlo: C-x d (detach). NO uses exit.
bind g display-popup -d "#{pane_current_path}" -w 95% -h 95% -E \
  'n="scratch-$(basename "$PWD" | tr ".: " "___")"; tmux attach -t "$n" 2>/dev/null || tmux new -s "$n"'
# C-x G  -> mata la sesion scratch del proyecto actual (empezar limpio)
bind G run-shell \
  'tmux kill-session -t "scratch-$(echo "#{b:pane_current_path}" | tr ".: " "___")" 2>/dev/null'

# ---- plugins (TPM) ----
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# guardar/restaurar sesiones
set -g @resurrect-save 'w'
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-strategy-nvim 'session'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

run '~/.tmux/plugins/tpm/tpm'

# ---- tmux-cc-sessions (local, sin publicar) ----
# prefix + u -> abre el picker de sesiones (enter: saltar/enviar, ctrl-e: search/message, esc: cerrar)
run-shell '~/private/tmux-cc-sessions/cc_sessions.tmux'

# liberar el guardado por defecto de resurrect (ahora se guarda con C-x w)
unbind C-s
